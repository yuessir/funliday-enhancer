    <style>
:root {
  --bg-color: #0b0f19;
  --primary: #00f0ff;
  --primary-glow: rgba(0, 240, 255, 0.4);
  --secondary: #ff003c;
  --text-main: #ffffff;
  --text-muted: #8b9bb4;
  --card-bg: rgba(20, 27, 45, 0.6);
  --card-border: rgba(255, 255, 255, 0.05);
  --font-main: 'Outfit', 'Noto Sans TC', sans-serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font-main);
  background: var(--bg-color);
  color: var(--text-main);
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}

/* Background effects */
body::before {
  content: '';
  position: fixed;
  top: -20%;
  left: -10%;
  width: 50%;
  height: 50%;
  background: radial-gradient(circle, rgba(0,240,255,0.15) 0%, rgba(0,0,0,0) 60%);
  z-index: -1;
}

body::after {
  content: '';
  position: fixed;
  bottom: -20%;
  right: -10%;
  width: 50%;
  height: 50%;
  background: radial-gradient(circle, rgba(255,0,60,0.1) 0%, rgba(0,0,0,0) 60%);
  z-index: -1;
}

.app-container {
  max-width: 800px;
  margin: 0 auto;
  padding: 40px 20px;
}

.header {
  text-align: center;
  margin-bottom: 50px;
  animation: fadeInDown 0.8s ease-out;
}

.title {
  font-size: 2.5rem;
  font-weight: 800;
  background: linear-gradient(90deg, var(--primary), var(--secondary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 10px;
}

.subtitle {
  color: var(--text-muted);
  font-size: 1rem;
}

html {
  scroll-behavior: smooth;
}

.day-nav {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-bottom: 40px;
  flex-wrap: wrap;
}

.sticky-nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(11, 15, 25, 0.9);
  padding: 15px 0;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(0, 240, 255, 0.1);
}

.day-btn {
  padding: 10px 20px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 8px;
  color: var(--text-main);
  text-decoration: none;
  font-weight: 600;
  transition: all 0.3s ease;
}

.day-btn:hover, .day-btn.active {
  background: var(--primary);
  color: var(--bg-color);
  box-shadow: 0 0 15px var(--primary-glow);
}

.day-divider {
  scroll-margin-top: 100px;
  margin: 40px 0 20px 0;
  padding: 10px 30px;
  background: rgba(0, 240, 255, 0.1);
  color: var(--primary);
  border: 1px solid var(--primary);
  border-radius: 50px;
  display: inline-block;
  font-size: 1.5rem;
  font-weight: 800;
  box-shadow: 0 0 15px var(--primary-glow);
}

.timeline-container {
  position: relative;
}

/* The vertical line */
.timeline-container::before {
  content: '';
  position: absolute;
  left: 30px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: linear-gradient(180deg, var(--primary) 0%, var(--secondary) 100%);
  opacity: 0.3;
}

.timeline-item {
  position: relative;
  padding-left: 70px;
  margin-bottom: 40px;
  animation: fadeInUp 0.6s ease-out forwards;
  opacity: 0;
}

.timeline-item:nth-child(2) { animation-delay: 0.2s; }
.timeline-item:nth-child(3) { animation-delay: 0.4s; }
.timeline-item:nth-child(4) { animation-delay: 0.6s; }

/* The dot on the line */
.timeline-dot {
  position: absolute;
  left: 21px;
  top: 20px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--bg-color);
  border: 2px solid var(--primary);
  box-shadow: 0 0 15px var(--primary-glow);
  z-index: 2;
  transition: all 0.3s ease;
}

.timeline-item:hover .timeline-dot {
  background: var(--primary);
  transform: scale(1.2);
}

/* Card Styling */
.poi-cards-container {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
}

.poi-card {
  flex: 1;
  min-width: 250px;
  background: var(--card-bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--card-border);
  border-radius: 16px;
  padding: 24px;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.poi-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 240, 255, 0.1);
  border-color: rgba(255, 255, 255, 0.15);
}

.poi-time {
  display: inline-block;
  padding: 4px 12px;
  background: rgba(0, 240, 255, 0.1);
  color: var(--primary);
  border-radius: 20px;
  font-size: 0.85rem;
  font-weight: 600;
  margin-bottom: 12px;
  letter-spacing: 0.5px;
}

.poi-name {
  font-size: 1.4rem;
  font-weight: 700;
  margin-bottom: 15px;
  line-height: 1.3;
}

.poi-details {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.detail-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  text-decoration: none;
  color: var(--text-muted);
  transition: color 0.3s ease;
  font-size: 0.95rem;
  line-height: 1.5;
}

.detail-item i {
  margin-top: 4px;
  font-size: 1.1rem;
  color: var(--primary);
  transition: transform 0.3s ease;
}

.detail-item:hover {
  color: var(--text-main);
}

.detail-item:hover i {
  transform: scale(1.1) translateY(-2px);
  color: var(--secondary);
}

/* Transportation Connector */
.transport-connector {
  position: relative;
  padding-left: 70px;
  margin-bottom: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  opacity: 0;
  animation: fadeIn 0.6s ease-out forwards;
}

.transport-link {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: rgba(255, 0, 60, 0.1);
  color: var(--secondary);
  padding: 8px 16px;
  border-radius: 8px;
  text-decoration: none;
  font-size: 0.9rem;
  font-weight: 600;
  border: 1px solid rgba(255, 0, 60, 0.2);
  transition: all 0.3s ease;
}

.transport-link i {
  font-size: 1.2rem;
}

.transport-link:hover {
  background: var(--secondary);
  color: #fff;
  transform: translateX(5px);
  box-shadow: 0 5px 15px rgba(255, 0, 60, 0.3);
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeInDown {
  from { opacity: 0; transform: translateY(-30px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@media (max-width: 600px) {
  .timeline-container::before { left: 20px; }
  .timeline-item { padding-left: 50px; }
  .timeline-dot { left: 11px; }
  .transport-connector { padding-left: 50px; }
  .poi-name { font-size: 1.2rem; }
}

@keyframes pulse-ring {
  0% {
    transform: scale(1);
    box-shadow: 0 0 0 0 rgba(0, 240, 255, 0.7);
  }
  70% {
    transform: scale(1.5);
    box-shadow: 0 0 0 15px rgba(0, 240, 255, 0);
  }
  100% {
    transform: scale(1);
    box-shadow: 0 0 0 0 rgba(0, 240, 255, 0);
  }
}

.current-location-pulse {
  background: var(--primary) !important;
  box-shadow: 0 0 0 0 rgba(0, 240, 255, 0.7) !important;
  animation: pulse-ring 2s infinite cubic-bezier(0.215, 0.61, 0.355, 1) !important;
}

.active-item .poi-card {
  border-color: var(--primary);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 25px rgba(0, 240, 255, 0.3);
}

      function getRequestedDays() {
        const urlParams = new URLSearchParams(window.location.search);
        const daysParam = urlParams.get('days');
        if (!daysParam) return allDaysData.map((d, i) => i + 1);
        
        const requested = new Set();
        const parts = daysParam.split(',');
        parts.forEach(part => {
          if (part.includes('-')) {
            const [start, end] = part.split('-').map(Number);
            for (let i = start; i <= end; i++) {
              if (i > 0 && i <= allDaysData.length) requested.add(i);
            }
          } else {
            const dayNum = Number(part);
            if (dayNum > 0 && dayNum <= allDaysData.length) requested.add(dayNum);
          }
        });
        return Array.from(requested).sort((a,b) => a-b);
      }

      function createGoogleMapsAddressLink(address) {
        if (!address) return '#';
        return 'https://www.google.com/maps/search/?api=1&hl=zh-TW&query=' + encodeURIComponent(address);
      }

      function createGoogleMapsDirLink(origin, destination, mode) {
        if (!origin || !destination) return '#';
        return 'https://www.google.com/maps/dir/?api=1&hl=zh-TW&origin=' + encodeURIComponent(origin) + '&destination=' + encodeURIComponent(destination) + '&travelmode=' + mode;
      }

      let currentActiveTab = 'all';

      window.switchTab = function(tabId) {
        currentActiveTab = tabId;
        renderTimeline();
      };

      function renderTimeline() {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('embed') === '1' || urlParams.get('minimal') === '1') {
          document.getElementById('main-header').style.display = 'none';
        }

        const navContainer = document.getElementById('nav-container');
        const container = document.getElementById('timeline');
        let html = '';
        let navHtml = '';
        
        const daysToRender = getRequestedDays();

        navHtml += `<button class="day-btn ${currentActiveTab === 'all' ? 'active' : ''}" onclick="switchTab('all')">全部</button>`;
        daysToRender.forEach(dayNum => {
          navHtml += `<button class="day-btn ${currentActiveTab === dayNum ? 'active' : ''}" onclick="switchTab(${dayNum})">第 ${dayNum} 天</button>`;
        });

        const displayDays = currentActiveTab === 'all' ? daysToRender : [currentActiveTab];

        displayDays.forEach(dayNum => {
          const dayIndex = dayNum - 1;
          const dayData = allDaysData[dayIndex];
          if (!dayData) return;

          html += `
            <div class="day-divider">
              <h2>Day ${dayNum}</h2>
            </div>
          `;

          dayData.forEach((group, index) => {
            html += `
              <div class="timeline-item">
                <div class="timeline-dot" id="dot-${dayNum}-${index}"></div>
                <div class="poi-time" style="margin-bottom: 15px; display:inline-block; font-size: 1.2rem; background: rgba(0, 240, 255, 0.15); border: 1px solid var(--primary);"><i class="fa-regular fa-clock"></i> ${group.startTime}</div>
                <div class="poi-cards-container">
            `;
            
            group.pois.forEach(poi => {
              html += `
                  <div class="poi-card" ${poi.lat ? `data-lat="${poi.lat}" data-lng="${poi.lng}"` : ''}>
                    <div class="poi-time" style="font-size: 0.85rem; margin-bottom: 8px;">${poi.time}</div>
                    <h2 class="poi-name">${poi.name}</h2>
                    <div class="poi-details">
                      <a href="${createGoogleMapsAddressLink(poi.address)}" target="_blank" class="detail-item" title="點擊開啟 Google Maps">
                        <i class="fa-solid fa-location-dot"></i>
                        <span>${poi.address || '無地址資訊'}</span>
                      </a>
                      ${poi.tel ? `
                      <a href="tel:${poi.tel}" class="detail-item" title="撥打電話">
                        <i class="fa-solid fa-phone"></i>
                        <span>${poi.tel}</span>
                      </a>` : ''}
                    </div>
                  </div>
              `;
            });
            
            html += `</div></div>`; 

            if (index < dayData.length - 1) {
              let latestEndTime = -1;
              let originPoi = group.pois[0];
              let transport = group.pois[0].transport;
              
              group.pois.forEach(p => {
                const endMatch = p.time.match(/-\s*(\d{2}:\d{2})/);
                if (endMatch) {
                  const parts = endMatch[1].split(':');
                  const mins = parseInt(parts[0]) * 60 + parseInt(parts[1]);
                  if (mins > latestEndTime) {
                    latestEndTime = mins;
                    originPoi = p;
                    if (p.transport) transport = p.transport;
                  }
                } else {
                  if (p.transport && !transport) transport = p.transport;
                }
              });
              
              if (!transport) {
                transport = group.pois.find(p => p.transport)?.transport;
              }
              
              if (!transport) {
                transport = {
                  mode: 'driving',
                  icon: 'fa-route',
                  duration: '規劃路線'
                };
              }

              if (transport) {
                const nextPoi = dayData[index + 1].pois.find(p => p.address);
                const dirLink = createGoogleMapsDirLink(originPoi ? originPoi.address : '', nextPoi ? nextPoi.address : '', transport.mode);
                
                html += `
                  <div class="transport-connector" style="animation-delay: ${0.2 * index + 0.3}s">
                    <a href="${dirLink}" target="_blank" class="transport-link" title="點擊開啟導航">
                      <i class="fa-solid ${transport.icon}"></i>
                      <span>${transport.duration}</span>
                      <i class="fa-solid fa-chevron-right" style="font-size: 0.8rem; margin-left: 4px;"></i>
                    </a>
                  </div>
                `;
              }
            }
          });
        });

        navContainer.innerHTML = navHtml;
        container.innerHTML = html;
        
        // 若之前已經啟動過定位，切換選項卡時直接重新高亮，否則等待使用者手動點擊按鈕
        if (window.isLocationTrackingActive && window.lastPosition) {
           updateLocationHighlight(window.lastPosition);
        }
      }

      function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371e3; 
        const φ1 = lat1 * Math.PI/180;
        const φ2 = lat2 * Math.PI/180;
        const Δφ = (lat2-lat1) * Math.PI/180;
        const Δλ = (lon2-lon1) * Math.PI/180;

        const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                  Math.cos(φ1) * Math.cos(φ2) *
                  Math.sin(Δλ/2) * Math.sin(Δλ/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
      }

      window.isLocationTrackingActive = false;
      window.lastPosition = null;

      function updateLocationHighlight(position) {
          window.lastPosition = position;
          const userLat = position.coords.latitude;
          const userLng = position.coords.longitude;
          
          let closestId = null;
          let minDistance = 500;

          const daysToRender = getRequestedDays();
          daysToRender.forEach(dayNum => {
            const dayIndex = dayNum - 1;
            const dayData = allDaysData[dayIndex];
            if (!dayData) return;

            dayData.forEach((group, gIdx) => {
              group.pois.forEach((poi) => {
                if (poi.lat && poi.lng) {
                  const dist = calculateDistance(userLat, userLng, poi.lat, poi.lng);
                  if (dist < minDistance) {
                    minDistance = dist;
                    closestId = `dot-${dayNum}-${gIdx}`;
                  }
                }
              });
            });
          });

          document.querySelectorAll('.timeline-dot').forEach(el => el.classList.remove('current-location-pulse'));
          document.querySelectorAll('.timeline-item').forEach(el => el.classList.remove('active-item'));
          
          if (closestId) {
            const dot = document.getElementById(closestId);
            if (dot) {
              dot.classList.add('current-location-pulse');
              dot.closest('.timeline-item').classList.add('active-item');
            }
          }
      }

      window.startLocationTracking = function() {
        const btn = document.getElementById('enable-location-btn');
        if (btn) btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 定位中 (模擬)...';
        
        setTimeout(() => {
          window.isLocationTrackingActive = true;
          if (btn) btn.style.display = 'none';
          
          // 模擬回報關西國際機場的位置 ( Day 1 - 關西國際機場 )
          updateLocationHighlight({
            coords: {
              latitude: 34.434854,
              longitude: 135.244141
            }
          });
          
          // 自動滾動到高亮的節點
          const activeDot = document.querySelector('.current-location-pulse');
          if(activeDot) {
            activeDot.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        }, 800);
      }

      document.addEventListener('DOMContentLoaded', renderTimeline);
    </script>
</body>
</html>
